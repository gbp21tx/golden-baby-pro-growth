name: Golden Baby Pro Social Promotion

on:
  workflow_dispatch:
  schedule:
    - cron: '15 16 * * *'

permissions:
  contents: read

jobs:
  create-social-content:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Generate seven-day content queue
        run: python social_campaign.py
      - name: Upload campaign drafts
        uses: actions/upload-artifact@v4
        with:
          name: golden-baby-pro-social-content
          path: social_output/
          if-no-files-found: error
          retention-days: 30
